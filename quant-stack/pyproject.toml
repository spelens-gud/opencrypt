[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencrew-quant-stack"
version = "0.1.0"
description = "Crypto quant system scaffold aligned with OpenCrew and OpenClaw orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenCrew" }
]
dependencies = ["ccxt>=4,<5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
